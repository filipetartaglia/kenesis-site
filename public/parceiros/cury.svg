<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none">
  <!-- Shield chevron icon - 5 chevron lines going bottom-left to top-right -->
  <!-- The chevrons form a shield/leaf shape pointing left -->
  <g transform="translate(6, 8)">
    <polyline points="50,72 8,54 50,36" stroke="#0D3B5E" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polyline points="50,58 16,44 50,28" stroke="#0D3B5E" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polyline points="50,44 24,33 50,20" stroke="#0D3B5E" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polyline points="50,30 34,22 50,12" stroke="#0D3B5E" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polyline points="50,16 44,12 50,6" stroke="#0D3B5E" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- CURY bold text -->
  <text x="72" y="74" font-family="'Arial Black', 'Arial', sans-serif" font-size="56" font-weight="900" fill="#0D3B5E">CURY</text>
</svg>
