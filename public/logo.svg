<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Left face of building (lime green) -->
  <polygon points="28,20 50,14 50,86 28,80" fill="#A1BA1F"/>
  <!-- Horizontal lines on left face -->
  <line x1="28" y1="33" x2="50" y2="28" stroke="#03423B" stroke-width="2"/>
  <line x1="28" y1="46" x2="50" y2="42" stroke="#03423B" stroke-width="2"/>
  <line x1="28" y1="59" x2="50" y2="56" stroke="#03423B" stroke-width="2"/>
  <line x1="28" y1="72" x2="50" y2="70" stroke="#03423B" stroke-width="2"/>
  <!-- Right face of building (dark teal) -->
  <polygon points="50,14 72,20 72,80 50,86" fill="#1a6b5e"/>
  <!-- Horizontal lines on right face -->
  <line x1="50" y1="28" x2="72" y2="33" stroke="#03423B" stroke-width="2"/>
  <line x1="50" y1="42" x2="72" y2="46" stroke="#03423B" stroke-width="2"/>
  <line x1="50" y1="56" x2="72" y2="59" stroke="#03423B" stroke-width="2"/>
  <line x1="50" y1="70" x2="72" y2="72" stroke="#03423B" stroke-width="2"/>
</svg>
